
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة المبرمجين | ILMO Health</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #f4f7fb;
      background: linear-gradient(145deg, #0b1424, #172b40);
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 28px 20px;
      text-align: center;
      border: 1px solid #35c5b2;
      border-radius: 24px;
      background: #101e30;
      box-shadow: 0 18px 45px #0005;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      color: #35c5b2;
      font-size: 27px;
    }

    .subtitle {
      color: #b9c8d9;
      margin: 0 0 25px;
      font-size: 14px;
    }

    .card {
      margin-bottom: 14px;
      padding: 19px 14px;
      border-radius: 16px;
      background: #1a2c42;
      border: 1px solid #ffffff12;
    }

    .role {
      margin-bottom: 12px;
      color: #35c5b2;
      font-weight: bold;
      font-size: 16px;
    }

    .name {
      font-size: 17px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .back-button {
      display: block;
      margin-top: 22px;
      padding: 14px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #35c5b2;
      color: #10202b;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .back-button:active {
      opacity: 0.8;
    }

    footer {
      margin-top: 22px;
      color: #9aadc2;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">👨‍💻</div>

    <h1>قائمة المبرمجين</h1>
    <p class="subtitle">فريق عمل ILMO Health</p>

    <section class="card">
      <div class="role">إنتاج وبرمجة البرنامج</div>
      <div class="name">الطالب إياد محمد إياد</div>
    </section>

    <section class="card">
      <div class="role">مساعدة الطلاب</div>
      <div class="name">
        محمد رضا إياد توكي
        <br>
        مقتدى حسين رميح
      </div>
    </section>

    <button class="back-button" type="button" onclick="goBack()">
      رجوع
    </button>

    <footer>ILMO Health ©</footer>
  </main>

  <script>
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
