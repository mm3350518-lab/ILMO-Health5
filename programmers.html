
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>قائمة المبرمجين | ILMO Health</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(145deg, #0f172a, #142d4e, #0f766e);
      color: #ffffff;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 36px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.8;
    }

    .card {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 22px 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
    }

    .role {
      color: #5eead4;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.9;
      margin-top: 26px;
    }

    .brand {
      color: #5eead4;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .back-button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      color: white;
      background: rgba(255, 255, 255, 0.1);
      font-size: 16px;
      text-align: center;
      text-decoration: none;
    }

    .back-button:active {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">💻</div>
      <h1>قائمة المبرمجين</h1>
      <p class="subtitle">
        الأشخاص القائمون على تطوير وإعداد تطبيق
        <span class="brand">ILMO Health</span>
      </p>
    </header>

    <section class="card">
      <div class="role">مبرمج البرنامج</div>
      <div class="name">الطالب إياد محمد إياد</div>
    </section>

    <section class="card">
      <div class="role">مساعدة الطلاب</div>
      <div class="name">محمد رضا إياد الملقب بتكي</div>
    </section>

    <section class="card">
      <div class="role">مساعدة الطلاب</div>
      <div class="name">مقتدى حسين رميح الملقب بوطن</div>
    </section>

    <footer class="footer">
      <div class="brand">ILMO Health</div>
      علمٌ نتعلّمه، ومستقبلٌ نبنيه.
      <br>
      جميع الحقوق محفوظة © 2026
    </footer>

    <a class="back-button" href="index.html">العودة إلى الصفحة الرئيسية</a>

  </main>
</body>
</html>
