
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102a43">
<title>صيدليتي</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Tahoma, Arial, sans-serif;
  background: #f2f6fb;
  color: #172b4d;
  min-height: 100vh;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 18px;
}

.header {
  background: linear-gradient(135deg, #102a43, #1b4965);
  color: white;
  border-radius: 24px;
  padding: 28px 22px;
  box-shadow: 0 10px 28px #102a4320;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 60px;
  height: 60px;
  background: #20b8a6;
  border-radius: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 34px;
  color: #102a43;
}

.header h1 {
  font-size: 29px;
  margin-bottom: 8px;
}

.header p {
  color: #d5e5ef;
  font-size: 13px;
  line-height: 1.8;
}

.welcome {
  margin: 27px 3px 20px;
}

.welcome h2 {
  font-size: 22px;
  margin-bottom: 9px;
}

.welcome p {
  color: #718096;
  line-height: 1.8;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.card {
  background: white;
  border: 1px solid #e2eaf2;
  border-radius: 21px;
  padding: 20px 15px;
  min-height: 150px;
  text-align: right;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  box-shadow: 0 5px 18px #102a4308;
  transition: .2s;
}

.card:active {
  transform: scale(.97);
}

.card:hover {
  border-color: #20b8a6;
  box-shadow: 0 8px 24px #102a4312;
}

.icon {
  width: 53px;
  height: 53px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 16px;
  font-size: 28px;
  margin-bottom: 14px;
}

.blue { background: #e8f0ff; }
.green { background: #e2faf4; }
.orange { background: #fff0dd; }
.purple { background: #f0e9ff; }

.card h3 {
  font-size: 17px;
  margin-bottom: 9px;
}

.card p {
  font-size: 12px;
  color: #718096;
  line-height: 1.9;
}

.content {
  margin-top: 20px;
  padding: 22px;
  background: white;
  border: 1px solid #e2eaf2;
  border-radius: 20px;
  display: none;
  line-height: 2;
}

.content.active {
  display: block;
}

.content h2 {
  margin-bottom: 12px;
  font-size: 21px;
}

.content p {
  color: #62748a;
  font-size: 14px;
}

.back {
  background: #102a43;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 11px 22px;
  margin-top: 17px;
  font-family: inherit;
  cursor: pointer;
}

.footer {
  text-align: center;
  color: #8795a7;
  font-size: 12px;
  padding: 25px 10px;
}

@media (max-width: 420px) {
  .container {
    padding: 12px;
  }

  .header {
    padding: 22px 15px;
  }

  .header h1 {
    font-size: 25px;
  }

  .grid {
    gap: 10px;
  }

  .card {
    padding: 15px 12px;
    min-height: 145px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="brand">
      <div class="logo">⚕</div>
      <div>
        <h1>صيدليتي</h1>
        <p>منصتك التعليمية لمراجعة الأدوية والحالات السريرية</p>
      </div>
    </div>
  </header>

  <section class="welcome">
    <h2>أهلاً بك 👋</h2>
    <p>اختَر القسم الذي تريد الدخول إليه وواصل رحلتك التعليمية.</p>
  </section>

  <main class="grid">

    <button class="card" onclick="openSection('progress')">
      <div class="icon blue">📈</div>
      <h3>التقدّم</h3>
      <p>تابع إنجازك والموضوعات التي أكملتها.</p>
    </button>

    <button class="card" onclick="openSection('medications')">
      <div class="icon green">💊</div>
      <h3>الأدوية</h3>
      <p>مراجعة الأدوية ومعلوماتها وتصنيفاتها.</p>
    </button>

    <button class="card" onclick="openSection('cases')">
      <div class="icon orange">🩺</div>
      <h3>الكيسات السريرية</h3>
      <p>تدرّب على الحالات والأسئلة التطبيقية.</p>
    </button>

    <button class="card" onclick="openSection('developers')">
      <div class="icon purple">👨‍💻</div>
      <h3>المبرمجون</h3>
      <p>التعرّف على فريق تطوير التطبيق.</p>
    </button>

  </main>

  <section class="content" id="content">
    <h2 id="sectionTitle"></h2>
    <p id="sectionDescription"></p>
    <button class="back" onclick="closeSection()">رجوع</button>
  </section>

  <footer class="footer">
    صيدليتي | منصة تعليمية للصيدلة
  </footer>

</div>

<script>
const sections = {
  progress: {
    title: "التقدّم",
    description:
      "هنا تظهر متابعة تقدمك والموضوعات التي أكملتها. يمكن ربط هذا القسم بنظام حفظ التقدم الموجود في التطبيق."
  },

  medications: {
    title: "الأدوية",
    description:
      "قسم مراجعة الأدوية ومعلوماتها واستعمالاتها وتصنيفاتها ومصادرها العلمية الموثوقة."
  },

  cases: {
    title: "الكيسات السريرية",
    description:
      "قسم الحالات السريرية التدريبية والأسئلة التفاعلية مع الشرح والإجابات."
  },

  developers: {
    title: "المبرمجون",
    description:
      "تطوير التطبيق: أضف أسماء المبرمجين ومعلومات فريق العمل هنا."
  }
};

function openSection(section) {
  const data = sections[section];

  document.getElementById("sectionTitle").textContent =
    data.title;

  document.getElementById("sectionDescription").textContent =
    data.description;

  document.getElementById("content").classList.add("active");

  document.getElementById("content").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function closeSection() {
  document.getElementById("content").classList.remove("active");
}
</script>

</body>
</html>
