
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f8c">
<title>المادة العلمية | صيدليتي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f8fa;color:#203344;font-family:Arial,sans-serif;padding-bottom:70px}
header{background:linear-gradient(135deg,#075b67,#13a6a0);color:white;padding:22px 16px;border-radius:0 0 22px 22px}
header a{color:white;text-decoration:none}
h1{font-size:23px;margin:12px 0 5px}
main{max-width:850px;margin:auto;padding:15px}
input{width:100%;padding:13px;border:1px solid #dce7eb;border-radius:12px;font-size:16px;margin-bottom:12px}
.module{background:white;border:1px solid #e2ebef;border-radius:14px;margin:10px 0;overflow:hidden}
.module button{width:100%;border:0;background:white;padding:15px;text-align:right;font-size:16px;cursor:pointer}
.topics{display:none;padding:0 12px 12px}
.module.open .topics{display:block}
.topic{border-top:1px solid #e2ebef;padding:10px 0}
.topic button{background:#e8f5f6;color:#075b67;border-radius:9px;font-weight:bold}
.details{display:none;padding:10px;line-height:1.8;font-size:14px;white-space:pre-wrap}
.topic.show .details{display:block}
.label{font-weight:bold;color:#087f8c;margin-top:10px}
#status{color:#718096;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 3px;border-top:1px solid #ddd}
nav a{text-decoration:none;color:#087f8c;font-size:12px}
</style>
</head>
<body>
<header>
<a href="index.html">← الرئيسية</a>
<h1>📚 المادة العلمية</h1>
<div>مكتبة المواضيع والمراجعة الصيدلانية</div>
</header>
<main>
<input id="search" placeholder="ابحث عن موضوع علمي..." type="search">
<div id="status">جاري تحميل المادة العلمية...</div>
<div id="content"></div>
</main>
<nav>
<a href="index.html">⌂ الرئيسية</a>
<a href="drugs.html">💊 الأدوية</a>
<a href="cases.html">🩺 الحالات</a>
<a href="library.html">📚 المادة العلمية</a>
</nav>
<script>
let modules=[];
const fields=[
["class","التصنيف"],
["moa","آلية العمل"],
["uses","الاستخدامات"],
["risks","المخاطر والآثار الجانبية"],
["interactions","التداخلات الدوائية"],
["counsel","إرشادات وملاحظات"]
];
function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const root=document.getElementById("content");
 root.innerHTML="";
 let count=0;
 const result=modules.map(m=>({
  ...m,
  topics:(m.topics||[]).filter(t=>
   !q||[m.name,m.ar,m.intro,t.title,
   ...fields.map(f=>t[f[0]])].join(" ").toLowerCase().includes(q))
 })).filter(m=>!q||m.topics.length);
 result.forEach(m=>{
  count+=m.topics.length;
  const section=document.createElement("section");
  section.className="module";
  const head=document.createElement("button");
  head.innerHTML=safe(m.icon||"📘")+" "+safe(m.ar||m.name)+
   " — "+m.topics.length+" موضوع";
  head.onclick=()=>section.classList.toggle("open");
  const list=document.createElement("div");
  list.className="topics";
  m.topics.forEach(t=>{
   const item=document.createElement("div");
   item.className="topic";
   const btn=document.createElement("button");
   btn.textContent=t.title||"موضوع علمي";
   btn.onclick=()=>item.classList.toggle("show");
   const details=document.createElement("div");
   details.className="details";
   details.innerHTML=fields.filter(f=>t[f[0]]).map(f=>
    '<div class="label">'+f[1]+'</div><div>'+
    safe(t[f[0]])+'</div>').join("");
   item.append(btn,details);
   list.append(item);
  });
  section.append(head,list);
  if(q)section.classList.add("open");
  root.append(section);
 });
 document.getElementById("status").textContent=
  result.length?"الأقسام: "+result.length+" | المواضيع: "+count:
  "ماكو نتائج مطابقة. جرّب كلمة ثانية.";
 if(!result.length)root.textContent="لم يتم العثور على مواضيع.";
}
fetch("library-data.json")
.then(r=>{if(!r.ok)throw Error("تعذّر تحميل الملف");return r.json()})
.then(data=>{modules=data.modules||[];render()})
.catch(err=>{
 document.getElementById("status").textContent=
 "تعذّر تحميل المادة العلمية. تأكد من تضمين library-data.json بالتطبيق.";
});
document.getElementById("search").addEventListener("input",render);
</script>
</body>
</html>
